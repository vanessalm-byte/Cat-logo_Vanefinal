<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Café & Origen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none text-dark font-serif fs-2 fw-bold">Café & Origen</a>
                    <p class="text-muted small mt-1">Selecciona tu tipo de acceso</p>
                </div>

                <div class="card border-0 shadow-sm rounded-4 p-4">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="userRole" class="form-label small fw-semibold">Tipo de Cuenta</label>
                            <select class="form-select rounded-3" id="userRole" required>
                                <option value="cliente">Cliente (Tienda y Carrito)</option>
                                <option value="admin">Administrador (Gestión de Catálogo)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="userName" class="form-label small fw-semibold">Nombre</label>
                            <input type="text" class="form-control rounded-3" id="userName" placeholder="Ej. Vanessa" required>
                        </div>

                        <div class="mb-3">
                            <label for="userEmail" class="form-label small fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control rounded-3" id="userEmail" placeholder="correo@ejemplo.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="userPassword" class="form-label small fw-semibold">Contraseña</label>
                            <input type="password" class="form-control rounded-3" id="userPassword" placeholder="••••••••" required minlength="4">
                        </div>

                        <button type="submit" class="btn btn-coffee w-100 rounded-pill py-2 fw-semibold">
                            Entrar
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="index.html" class="text-muted small text-decoration-none">← Volver al catálogo</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
